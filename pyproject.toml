[build-system]
requires = ["setuptools>=68"]
build-src = "setuptools.build_meta"

[project]
name = "group-scheduling-app"
version = "0.1.0"
description = "Group scheduling app — shareable availability links with automatic group formation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "python-dotenv>=1,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]
